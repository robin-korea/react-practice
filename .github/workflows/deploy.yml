# 작업이름
name: Publish React practice

# 실행 시점
on:
  push:      # 코드를 올리면 자동 실행
    branches: [main]   # main 브랜치에 push 이벤트가 발생하면 워크플로 실행하라는 의미.
  workflow_dispatch:   # 사용자가 Github에서 직접 실행할 수 있도록 허용.

# GitHub Actions에 허용할 작업(권한)
permissions:
  contents: read   # 소스코드를 가져오기 위해 저장소 콘텐츠 읽기 
  pages: write      # 웹사이트를 배포하기 위해 GitHub Pages에 쓰기
  id-token: write   # 배포과정에 신원 증명을 위해 OIDC(OpenID Connect) 토큰 요청 허용

# 배포(여러 실행)이  겹칠 경우 
concurrency:
  group: pages      # 실행들을 pages 라는 같은 그룹으로 묶습니다.
  cancel-in-progress: true # 같은 그룹에서 이전 실행이 진행 중이라면 취소하고 새 실행을 진행할수 있도록 한다.

# 실제로 수행할 작업 정의 부분
# Workflow: 전체 자동화 절차
#  ㄴ Job: 그 안에서 실행되는 작업 단위
#     ㄴ Step: Job 내부의 개별 단계
jobs:
  publish:
    # 어떤 컴퓨터에서 실행할 것인가?
    # 그 컴퓨터에서 다음 작업들이 수행됩니다.
   # - 저장소의 소스 코드 다운로드
   # - Node.js 실행 환경 준비
   # - npm 패키지 설치
   # - React 프로젝트 빌드
   # - 배포 파일 준비 및 업로드
    runs-on: ubuntu-latest     #  GitHub가 제공하는 Ubuntu 기반 실행 머신을 사용
    # [ 배포 환경과 결과 URL ]
    # GitHub의 배포 환경(Environment)과 연결
    environment:
      name: github-pages   # GitHub에서 배포를 관리할 때 사용할 환경의 이름
      url: ${{ steps.publish.outputs.page_url }}   #배포가 완료된 뒤 확인할 웹사이트 URL을 연결
    # 배포를 위해 수행할 실제 작업을 순서대로 실행하기( 가장 중요한 부분 )
    # (핵심) 각 단계의 앞 단계의 결과를 이용한다는 점 
    steps:
      # uses - 기존 작업을 불러올 것인가?
      - uses: actions/checkout@v7   # 첫 번째 단계: GitHub Actions에서 제공하는 checkout 액션을 실행
      - uses: actions/setup-node@v7   # 두 번째 단계: Node.js 준비하기
        with:
          node-version: '24'
          cache: npm
      # run - 명령어를 실행할 것인가?
      - run: npm ci         # 세 번째 단계: 의존성 설치하기 npm install 대신 npm ci 사용
      - run: npm run build      # 네 번째 단계: React 프로젝트 빌드하기
      - uses: actions/configure-pages@v6  # 다섯 번째 단계: GitHub Pages 배포에 필요한 설정 준비하기
      - uses: actions/upload-pages-artifact@v5 # 여섯 번째 단계: 빌드 결과물 포장하기
        with:            # 일곱 번째 단계: 실제로 배포하기(  액션에 전달할 설정값을 작성하는 부분 )
          path: dist
      - name: Publish   # GitHub Actions 실행 화면에 표시되는 단계 이름
        id: publish   # 다른 단계에서 이 단계를 참조하기 위한 식별자
        uses: actions/deploy-pages@v5   # Pages 배포 액션을 실행

# 1) Artifact: 워크플로 실행 중 생성되어 다음 단계에서 사용할 수 있도록 저장하거나 전달하는 파일 묶음이라고 이해하자.
# 2) GitHub Pages는 React 개발 환경을 직접 실행하는 것이 아니라, 
#    브라우저가 요청하는 정적 파일을 제공합니다. 따라서 배포 대상은 
#    일반적으로 프로젝트 전체가 아니라 빌드 결과물인 dist입니다


# 3) 실행 환경에서 명령어
# 문법   의미         예시
# uses  기존 액션 사용      actions/checkout@v7
# run   셸 명령어 실행      npm ci
# with   액션에 설정값 전달   node-version: '24'
# id   단계를 참조할 식별자 지정   id: publish
# name   표시할 이름 지정   name: Publish

# 4) 참고로 @v7, @v6, @v5는 각 액션의 버전을 지정하는 표기입니다.
# React나 Node.js의 버전을 의미하는 것은 아닙니다.

# 5) 마지막으로 기억하면 좋은 핵심
#   on은 실행 시점을 결정합니다.
#   jobs와 steps는 실행할 작업과 순서를 정의합니다.
#   npm ci는 필요한 패키지를 설치합니다.
#   npm run build는 배포용 파일을 만듭니다.
#   upload-pages-artifact는 결과물을 배포용으로 준비합니다.
#   deploy-pages는 결과물을 실제로 공개합니다.